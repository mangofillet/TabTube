<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- TabTube app icon (original): a large white T with a smaller T knocked out of it,
       so the gradient background shows through the hollow inner T. -->
  <defs>
    <linearGradient id="tt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6200ea"/>
      <stop offset="1" stop-color="#aa00ff"/>
    </linearGradient>
    <mask id="tt-hole">
      <rect x="0" y="0" width="512" height="512" fill="white"/>
      <!-- inner T: black cuts a hole, revealing the tile behind -->
      <g fill="black">
        <rect x="150" y="158" width="212" height="28" rx="8"/>
        <rect x="240" y="158" width="32" height="170" rx="8"/>
      </g>
    </mask>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#tt-bg)"/>

  <g fill="#ffffff" mask="url(#tt-hole)">
    <rect x="100" y="140" width="312" height="60" rx="12"/>
    <rect x="226" y="140" width="60" height="240" rx="12"/>
  </g>
</svg>
