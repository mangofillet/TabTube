name: Build TabTube

# Builds Windows, macOS and Linux installers. Runs on a version tag (v*) or manually.
# Each OS builds on its own runner (macOS installers can only be built on macOS).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (AppImage)
            build: pnpm run pack && node _scripts/build-appimage.mjs
          - os: windows-latest
            name: Windows (nsis + portable)
            build: pnpm run pack && pnpm run build-release
          - os: macos-latest
            name: macOS (dmg)
            build: pnpm run pack && pnpm run build-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: ${{ matrix.build }}
        # Unsigned builds — users may see an "unidentified developer" / SmartScreen
        # warning. Add signing certs as secrets later if desired.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tabtube-${{ matrix.os }}
          path: |
            build/*.AppImage
            build/*.exe
            build/*.dmg
          if-no-files-found: warn

  # On a version tag, gather every OS's installers and publish them to the GitHub
  # Release automatically (no manual upload — that was the source of past 404s).
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: true
          body: |
            TabTube ${{ github.ref_name }} — a private YouTube client with tabs
            (unofficial fork of FreeTube, AGPL-3.0; not affiliated with the FreeTube project).

            **Downloads**
            - Linux: `.AppImage`
            - Windows: `.exe` (installer + portable)
            - macOS: `.dmg`

            Builds are unsigned: on macOS right-click → Open; on Windows use
            SmartScreen → More info → Run anyway.
